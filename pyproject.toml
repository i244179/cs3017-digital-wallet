[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs3017-digital-wallet"
version = "1.0.0"
description = "CS3017 ESA capstone: NayaPay-context wallet-to-bank transfer via a simulated Raast rail (synthetic data only)."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy==2.0.58",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.3",
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "PyJWT==2.15.0",
    "pika==1.5.0",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wallet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "phase1: database architecture and integrity-control tests",
    "phase2: backend services and API tests",
    "phase3: frontend contract tests",
    "rubric: the ten mandatory rubric scenarios (Phase 4, isolated database per test)",
    "unit: pure unit tests with no database or network",
    "integration: API/service tests against PostgreSQL",
    "concurrency: parallel-request tests on PostgreSQL row locks",
    "security: authentication, authorisation, input-hardening tests",
    "recovery: crash, outage, retry and restart recovery tests",
    "contract: OpenAPI / event-schema / Postman documents match the implementation (Phase 5)",
]
